spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          pool-name: HikariCP
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://mysql-0.mysql.aict.svc.cluster.local:3306/frame_admin_demo?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: passw0rd
        slave:
          type: com.zaxxer.hikari.HikariDataSource
          pool-name: HikariCP
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://mysql-0.mysql.aict.svc.cluster.local:3306/aict?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: passw0rd
      hikari:
        min-idle: 5
        max-pool-size: 20
        is-auto-commit: true
        idle-timeout: 6000
        max-lifetime: 300000
        connection-timeout: 30000
        connection-test-query: SELECT 1
